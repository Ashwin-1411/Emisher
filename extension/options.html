<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phishing Email Analyzer - Options</title>
    <style>
      :root { --bg: #fff; --fg: #1c2330; --muted: #5b6577; --border: #d6dbe4; --accent: #0b5cd5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #14181f; --fg: #e6e9ef; --muted: #9aa4b5; --border: #2c3442; --accent: #5ea1ff; } }
      body { max-width: 560px; margin: 32px auto; padding: 0 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input[type="text"], input[type="password"] { width: 100%; padding: 6px 8px; margin-top: 4px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; font: inherit; }
      .check { font-weight: 400; display: flex; gap: 8px; align-items: flex-start; }
      .hint { color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 2px; }
      button { margin-top: 18px; margin-right: 8px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: inherit; font: inherit; cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      #msg { margin-top: 14px; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <h1>Phishing Email Analyzer</h1>
    <form id="form">
      <label for="url">Backend URL
        <div class="hint">Where your analyzer backend runs, e.g. http://127.0.0.1:8000</div>
      </label>
      <input id="url" type="text" autocomplete="off" />
      <label for="token">API token
        <div class="hint">One of the values in the backend's API_TOKENS. Stored only in this browser profile.</div>
      </label>
      <input id="token" type="password" autocomplete="off" />
      <label class="check"><input id="enrich" type="checkbox" />
        <span>Use external lookups (VirusTotal, urlscan.io, RDAP)
          <div class="hint">Sends link URLs and attachment hashes to those services via your backend. Off = fully local analysis.</div></span>
      </label>
      <label class="check"><input id="auto" type="checkbox" />
        <span>Automatically analyze emails I open in Gmail
          <div class="hint">The raw source of each opened message is sent to YOUR backend (never stored there). Off = Gmail is not touched.</div></span>
      </label>
      <button class="primary" type="submit">Save</button>
      <button id="test" type="button">Test connection</button>
    </form>
    <div id="msg" role="status"></div>
    <script type="module" src="/src/options/main.ts"></script>
  </body>
</html>
